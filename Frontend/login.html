<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo - Organización</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light min-vh-100 d-flex justify-content-center align-items-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                
                <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5">
                    
                    <!-- Botón para volver al inicio -->
                    <a href="index.html" class="text-decoration-none text-secondary mb-4 d-inline-block">
                        <i class="fa-solid fa-arrow-left me-2"></i>Volver a la página principal
                    </a>

                    <div class="text-center mb-4">
                        <i class="fa-solid fa-user-shield fs-1 text-primary mb-3"></i>
                        <h1 class="h3 fw-bold custom-text-blue">Acceso Voluntarios</h1>
                        <p class="text-secondary">Ingresa tus credenciales para gestionar el inventario.</p>
                    </div>

                    <!-- Formulario de Login -->
                    <form id="formularioLogin">
                        
                        <!-- Campo RUT -->
                        <div class="mb-4">
                            <label for="rutInput" class="form-label fw-bold">RUT</label>
                            <div class="input-group input-group-lg shadow-sm">
                                <span class="input-group-text bg-white"><i class="fa-solid fa-id-card text-secondary"></i></span>
                                <input type="text" class="form-control" id="rutInput" placeholder="Ej: 12345678-9" required>
                            </div>
                        </div>

                        <!-- Campo Contraseña -->
                        <div class="mb-4">
                            <label for="passInput" class="form-label fw-bold">Contraseña</label>
                            <div class="input-group input-group-lg shadow-sm">
                                <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-secondary"></i></span>
                                <input type="password" class="form-control" id="passInput" placeholder="••••••••" required>
                            </div>
                        </div>

                        <!-- Mensaje de error oculto por defecto -->
                        <div id="mensajeError" class="alert alert-danger d-none" role="alert">
                            <i class="fa-solid fa-triangle-exclamation me-2"></i>Credenciales incorrectas.
                        </div>

                        <!-- Botón de Ingreso -->
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-3 shadow mt-2">
                            Iniciar Sesión <i class="fa-solid fa-right-to-bracket ms-2"></i>
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Script de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tu archivo script.js donde programaremos la lógica -->
    <script src="script.js"></script>
</body>
</html>
